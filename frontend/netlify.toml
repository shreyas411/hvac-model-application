# Netlify (base directory: frontend). The browser only ever talks to this site; /api/* is forwarded to the backend,
# so the session cookies are first-party. Build with VITE_API_URL unset/empty so the app calls /api/v1/... on this origin.
[build]
  command = "npm run build"
  publish = "dist"

# Proxy to the API (status 200 = rewrite, not a redirect). `force` so it wins over the SPA fallback below.
[[redirects]]
  from = "/api/*"
  to = "https://hvac-model-application.onrender.com/api/:splat"
  status = 200
  force = true

# SPA fallback for client-side routes.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# The service worker must always revalidate, or a new deploy never reaches installed clients.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
